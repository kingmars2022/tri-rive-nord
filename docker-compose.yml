services:
  postgres:
    image: postgres:16
    container_name: bienvenue-blainville-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bienvenue_blainville}
      POSTGRES_USER: ${DB_USERNAME:-blainville_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: America/Toronto
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bienvenue-blainville-redis
    restart: unless-stopped
    # Quota counters share this instance with caches: never evict counters.
    # At capacity, cache writes fail open and assistant quotas fail closed.
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: bienvenue-blainville-kafka
    restart: unless-stopped
    # KRaft mode: no ZooKeeper. One broker that is also its own controller,
    # which is the right size for a single-machine development stack.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  mongo:
    image: mongo:7
    container_name: bienvenue-blainville-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bienvenue-blainville-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # started, not healthy: the app boots and serves fine without Redis,
      # so a slow cache must not hold up the API.
      redis:
        condition: service_started
      # Same reasoning: the outbox records events into PostgreSQL whether or
      # not a broker is up, and the audit trail defaults to PostgreSQL. Neither is allowed
      # to delay the API.
      kafka:
        condition: service_started
      mongo:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bienvenue_blainville}
      DB_USERNAME: ${DB_USERNAME:-blainville_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@blainville.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-template}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
      # Empty by default: the assistant works without it. Supply your own key
      # in .env (git-ignored) to have Claude do the wording.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-30}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/bienvenue_blainville
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      AUDIT_STORE: ${AUDIT_STORE:-sql}
      TZ: America/Toronto
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  postgres_data:
  mongo_data:
